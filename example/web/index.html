<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CKB wallet example using ckb_flutter_client.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CKB Wallet</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (() => {
      const decode = (value) => {
        if (!value) return new Uint8Array();
        const normalized = value.replace(/-/g, '+').replace(/_/g, '/');
        const pad = '='.repeat((4 - (normalized.length % 4)) % 4);
        const binary = atob(normalized + pad);
        return Uint8Array.from(binary, (char) => char.charCodeAt(0));
      };
      const encode = (buffer) => {
        if (!buffer) return '';
        const bytes = new Uint8Array(buffer);
        let binary = '';
        bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
        return btoa(binary);
      };
      const prfFrom = (credential) => {
        const ext = credential.getClientExtensionResults?.() || {};
        return encode(ext.prf?.results?.first);
      };
      const requirePasskeys = () => {
        if (!window.PublicKeyCredential || !navigator.credentials) {
          throw new Error('unsupported');
        }
      };

      window.__ckbCreatePasskey = async function (rpId, userName, challengeB64, userIdB64, saltB64) {
        requirePasskeys();
        const publicKey = {
          challenge: decode(challengeB64),
          rp: { name: 'CKB Wallet', id: rpId || undefined },
          user: {
            id: decode(userIdB64),
            name: userName,
            displayName: userName,
          },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
          authenticatorSelection: {
            userVerification: 'required',
            residentKey: 'preferred',
          },
          timeout: 120000,
          extensions: saltB64 ? { prf: { eval: { first: decode(saltB64) } } } : {},
        };
        const credential = await navigator.credentials.create({ publicKey });
        const spki = credential.response.getPublicKey?.();
        if (!spki) {
          throw new Error('Passkey public key is unavailable');
        }
        return JSON.stringify({
          credentialId: encode(credential.rawId),
          publicKey: encode(spki),
          prf: prfFrom(credential),
        });
      };

      window.__ckbGetPasskey = async function (rpId, challengeB64, credentialIdB64, saltB64) {
        requirePasskeys();
        const allowCredentials = credentialIdB64
          ? [{ type: 'public-key', id: decode(credentialIdB64) }]
          : [];
        const credential = await navigator.credentials.get({
          publicKey: {
            challenge: decode(challengeB64),
            rpId: rpId || undefined,
            allowCredentials,
            userVerification: 'required',
            timeout: 120000,
            extensions: saltB64 ? { prf: { eval: { first: decode(saltB64) } } } : {},
          },
        });
        if (!credential) {
          throw new Error('Passkey sign-in was cancelled');
        }
        return JSON.stringify({
          credentialId: encode(credential.rawId),
          prf: prfFrom(credential),
        });
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
